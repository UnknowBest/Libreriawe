<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tienda Digital Cedeño | Catálogo Oficial</title>
  <!-- Fuentes universales para que los logos se vean idénticos en PC, Android y iPhone -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Cinzel:wght@700;900&family=Outfit:wght@400;600;700;800;900&family=Pacifico&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --fondo: #060911;
      --fondo-tarjeta: rgba(17, 24, 39, 0.86);
      --texto: #f8fafc;
      --texto-secundario: #94a3b8;
      --acento: #6366f1;
      --acento-hover: #4f46e5;
      --whatsapp: #22c55e;
      --whatsapp-hover: #16a34a;
      --borde: rgba(255, 255, 255, 0.1);
      --pichincha-amarillo: #ffdd00;
      --pichincha-azul: #0f265c;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Outfit', 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      background-color: var(--fondo);
      background-image: 
        radial-gradient(circle at 10% 10%, rgba(99, 102, 241, 0.16) 0%, transparent 45%),
        radial-gradient(circle at 90% 15%, rgba(168, 85, 247, 0.14) 0%, transparent 45%),
        radial-gradient(circle at 50% 90%, rgba(14, 165, 233, 0.1) 0%, transparent 50%);
      color: var(--texto);
      line-height: 1.5;
      min-height: 100vh;
    }

    .container {
      max-width: 1180px;
      margin: 0 auto;
      padding: 0 18px;
    }

    .oculto {
      display: none !important;
    }

    /* ==========================================
       BARRA DE NAVEGACIÓN OPTIMIZADA PARA MÓVIL Y PC
       ========================================== */
    .navbar {
      background-color: rgba(6, 9, 17, 0.9);
      border-bottom: 1px solid var(--borde);
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(16px);
    }

    .nav-content {
      display: flex;
      justify-content: space-between;
      align-items: center;
      min-height: 68px;
      padding: 10px 0;
      gap: 10px;
    }

    .logo {
      font-size: 1.4rem;
      font-weight: 900;
      letter-spacing: -0.3px;
      line-height: 1.15;
      white-space: nowrap;
    }

    .logo span {
      background: linear-gradient(90deg, #818cf8, #c084fc, #38bdf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .nav-acciones {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-shrink: 0;
    }

    .btn-contacto {
      background-color: rgba(255, 255, 255, 0.06);
      color: var(--texto);
      text-decoration: none;
      padding: 9px 14px;
      border-radius: 10px;
      border: 1px solid var(--borde);
      font-size: 0.88rem;
      font-weight: 700;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: 0.25s;
    }

    .btn-carrito {
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: white;
      border: none;
      padding: 9px 15px;
      border-radius: 10px;
      font-weight: 800;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-size: 0.88rem;
      white-space: nowrap;
      box-shadow: 0 4px 16px rgba(99, 102, 241, 0.4);
      transition: 0.25s;
    }

    .btn-carrito span {
      background-color: rgba(0, 0, 0, 0.35);
      padding: 2px 7px;
      border-radius: 99px;
      font-size: 0.78rem;
    }

    /* ==========================================
       HERO BANNER
       ========================================== */
    .hero {
      text-align: center;
      padding: 48px 16px 32px;
    }

    .badge {
      background: rgba(99, 102, 241, 0.14);
      color: #a5b4fc;
      padding: 7px 16px;
      border-radius: 99px;
      font-size: 0.82rem;
      font-weight: 700;
      display: inline-block;
      margin-bottom: 16px;
      border: 1px solid rgba(99, 102, 241, 0.35);
    }

    .hero h2 {
      font-size: 2.3rem;
      max-width: 720px;
      margin: 0 auto 12px;
      line-height: 1.18;
      font-weight: 900;
    }

    .hero p {
      color: var(--texto-secundario);
      max-width: 580px;
      margin: 0 auto 22px;
      font-size: 1rem;
    }

    .btn-principal {
      display: inline-block;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: white;
      text-decoration: none;
      padding: 12px 28px;
      border-radius: 12px;
      font-weight: 700;
      box-shadow: 0 6px 20px rgba(99, 102, 241, 0.35);
    }

    /* ==========================================
       BUSCADOR Y FILTROS
       ========================================== */
    .controles {
      margin: 10px 0 28px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    #buscador {
      width: 100%;
      padding: 14px 18px;
      border-radius: 13px;
      border: 1px solid var(--borde);
      background-color: rgba(17, 24, 39, 0.85);
      color: var(--texto);
      font-size: 0.96rem;
      outline: none;
    }

    #buscador:focus {
      border-color: var(--acento);
    }

    .filtros {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .btn-filtro {
      background-color: rgba(17, 24, 39, 0.8);
      color: var(--texto-secundario);
      border: 1px solid var(--borde);
      padding: 8px 18px;
      border-radius: 99px;
      cursor: pointer;
      font-weight: 700;
      font-size: 0.88rem;
      transition: 0.2s;
    }

    .btn-filtro.activo, .btn-filtro:hover {
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: white;
      border-color: transparent;
    }

    /* ==========================================
       GRID Y TARJETAS CON LOGOS ESTRUCTURADOS
       ========================================== */
    .grid-productos {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(285px, 1fr));
      gap: 24px;
      padding-bottom: 65px;
    }

    .tarjeta {
      --color-marca: #6366f1;
      background-color: var(--fondo-tarjeta);
      border: 1px solid var(--borde);
      border-radius: 20px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
    }

    .tarjeta:hover {
      transform: translateY(-6px);
      border-color: var(--color-marca);
      box-shadow: 0 18px 34px -12px rgba(0, 0, 0, 0.75), 0 0 24px -4px var(--color-marca);
    }

    .tarjeta-media {
      height: 155px;
      width: 100%;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      padding: 20px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .tarjeta-media::before {
      content: "";
      position: absolute;
      width: 140px;
      height: 140px;
      background: radial-gradient(circle, rgba(255,255,255,0.2) 0%, transparent 70%);
      border-radius: 50%;
      pointer-events: none;
    }

    .contenedor-logo-oficial {
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      padding-top: 12px;
      filter: drop-shadow(0 6px 14px rgba(0, 0, 0, 0.5));
    }

    /* Estilos universales de los Logos para que nunca se descuadren en móvil */
    .marca-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      user-select: none;
    }

    .logo-netflix {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 3.3rem;
      color: #e50914;
      letter-spacing: 5px;
      text-shadow: 0 4px 16px rgba(229, 9, 20, 0.75);
      line-height: 1;
    }

    .logo-disney {
      position: relative;
      display: inline-flex;
      align-items: baseline;
      font-family: 'Cinzel', Georgia, serif;
      font-weight: 900;
      font-size: 2.3rem;
      color: #ffffff;
      letter-spacing: 0.5px;
      padding-top: 10px;
    }
    .logo-disney .arco-disney {
      position: absolute;
      top: -6px;
      left: 5%;
      width: 90%;
      height: 28px;
      pointer-events: none;
    }
    .logo-disney .mas-disney {
      color: #38bdf8;
      font-family: 'Outfit', sans-serif;
      font-weight: 900;
      font-size: 2.1rem;
      margin-left: 2px;
      text-shadow: 0 0 10px #38bdf8;
    }

    .logo-hbomax {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .logo-hbomax .txt-hbo {
      font-family: 'Outfit', sans-serif;
      font-weight: 900;
      font-size: 2.4rem;
      color: #ffffff;
      letter-spacing: -1px;
      display: inline-flex;
      align-items: center;
    }
    .logo-hbomax .txt-max {
      font-family: 'Outfit', sans-serif;
      font-weight: 800;
      font-size: 2.2rem;
      color: #d8b4fe;
      letter-spacing: -0.5px;
    }

    .logo-prime {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
    }
    .logo-prime .txt-prime {
      font-family: 'Outfit', sans-serif;
      font-weight: 800;
      font-size: 1.95rem;
      color: #ffffff;
      letter-spacing: -0.5px;
      line-height: 1;
    }
    .logo-prime svg {
      width: 120px;
      height: 24px;
      margin-top: 2px;
    }

    .logo-canva {
      display: inline-flex;
      align-items: center;
      gap: 10px;
    }
    .logo-canva .circulo-canva {
      width: 66px;
      height: 66px;
      border-radius: 50%;
      background: linear-gradient(135deg, #00c4cc 0%, #3b82f6 50%, #8b5cf6 100%);
      border: 2.5px solid rgba(255, 255, 255, 0.9);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Pacifico', cursive;
      font-size: 1.45rem;
      color: #ffffff;
      box-shadow: 0 6px 16px rgba(0, 196, 204, 0.4);
    }
    .logo-canva .tag-pro {
      background: #facc15;
      color: #0f172a;
      font-weight: 900;
      font-size: 0.78rem;
      padding: 3px 9px;
      border-radius: 99px;
      letter-spacing: 0.5px;
    }

    .logo-paramount {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }
    .logo-paramount span {
      font-family: 'Cinzel', Georgia, serif;
      font-weight: 900;
      font-size: 1.4rem;
      color: #ffffff;
      letter-spacing: 0.5px;
    }

    .logo-texto-icono {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-weight: 900;
      font-size: 1.85rem;
      color: #ffffff;
      letter-spacing: -0.5px;
    }

    .tarjeta-media img.img-cover {
      width: 100%;
      height: 100%;
      object-fit: cover;
      position: absolute;
      inset: 0;
      z-index: 1;
    }

    .badge-flotante {
      position: absolute;
      top: 11px;
      left: 11px;
      z-index: 3;
      background-color: rgba(6, 9, 17, 0.78);
      backdrop-filter: blur(8px);
      color: #f1f5f9;
      padding: 4px 11px;
      border-radius: 99px;
      font-size: 0.68rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      border: 1px solid rgba(255, 255, 255, 0.16);
    }

    .badge-garantia {
      position: absolute;
      top: 11px;
      right: 11px;
      z-index: 3;
      background-color: rgba(34, 197, 94, 0.18);
      backdrop-filter: blur(8px);
      color: #4ade80;
      padding: 4px 10px;
      border-radius: 99px;
      font-size: 0.68rem;
      font-weight: 700;
      border: 1px solid rgba(34, 197, 94, 0.4);
    }

    .tarjeta-cuerpo {
      padding: 20px;
      display: flex;
      flex-direction: column;
      flex: 1;
      justify-content: space-between;
    }

    .tarjeta h3 {
      font-size: 1.25rem;
      margin-bottom: 6px;
      font-weight: 800;
      color: #ffffff;
    }

    .tarjeta p {
      color: var(--texto-secundario);
      font-size: 0.88rem;
      margin-bottom: 16px;
      line-height: 1.45;
    }

    .precio {
      font-size: 1.75rem;
      font-weight: 900;
      margin-bottom: 14px;
      display: flex;
      align-items: baseline;
      gap: 6px;
      color: #ffffff;
    }

    .precio span {
      font-size: 0.84rem;
      color: var(--texto-secundario);
      font-weight: 500;
    }

    .caja-selector-meses {
      margin-bottom: 14px;
      background-color: rgba(6, 9, 17, 0.65);
      padding: 9px 12px;
      border-radius: 11px;
      border: 1px solid var(--borde);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .caja-selector-meses label {
      font-size: 0.82rem;
      color: #cbd5e1;
      font-weight: 600;
    }

    .select-meses {
      background-color: #0f172a;
      color: var(--texto);
      border: 1px solid var(--acento);
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 0.86rem;
      font-weight: 700;
      cursor: pointer;
      outline: none;
    }

    .botones-tarjeta {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .btn-agregar-carrito {
      width: 100%;
      background: linear-gradient(135deg, #6366f1, #4f46e5);
      color: white;
      border: none;
      padding: 12px;
      border-radius: 11px;
      font-weight: 700;
      font-size: 0.94rem;
      cursor: pointer;
    }

    .btn-comprar-directo {
      display: block;
      text-align: center;
      background-color: rgba(34, 197, 94, 0.08);
      color: #4ade80;
      border: 1px solid rgba(34, 197, 94, 0.4);
      text-decoration: none;
      padding: 9px;
      border-radius: 11px;
      font-weight: 700;
      font-size: 0.88rem;
    }

    /* ==========================================
       MODAL DEL CARRITO
       ========================================== */
    .modal-fondo {
      position: fixed;
      inset: 0;
      background-color: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(6px);
      z-index: 200;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 14px;
    }

    .modal-contenido {
      background-color: #111827;
      border: 1px solid var(--borde);
      border-radius: 20px;
      width: 100%;
      max-width: 520px;
      max-height: 90vh;
      overflow-y: auto;
      padding: 20px;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--borde);
      padding-bottom: 12px;
      margin-bottom: 14px;
    }

    .btn-cerrar {
      background: none;
      border: none;
      color: var(--texto-secundario);
      font-size: 1.8rem;
      cursor: pointer;
      line-height: 1;
    }

    .carrito-vacio {
      text-align: center;
      color: var(--texto-secundario);
      padding: 30px 0;
    }

    .item-carrito {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid var(--borde);
      gap: 10px;
    }

    .item-info h4 {
      font-size: 0.92rem;
    }

    .item-info span {
      font-size: 0.78rem;
      color: var(--texto-secundario);
    }

    .item-controles {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .item-controles button {
      background-color: var(--fondo);
      color: var(--texto);
      border: 1px solid var(--borde);
      width: 28px;
      height: 28px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }

    .item-subtotal {
      min-width: 58px;
      text-align: right;
      color: #818cf8;
      font-size: 0.92rem;
    }

    .caja-cupon {
      margin-top: 14px;
      padding: 12px;
      background-color: rgba(99, 102, 241, 0.08);
      border: 1px dashed var(--acento);
      border-radius: 10px;
    }

    .caja-cupon label {
      display: block;
      font-size: 0.84rem;
      font-weight: 600;
      margin-bottom: 6px;
      color: #c7d2fe;
    }

    .fila-cupon {
      display: flex;
      gap: 8px;
    }

    .fila-cupon input {
      flex: 1;
      padding: 9px 12px;
      border-radius: 8px;
      border: 1px solid var(--borde);
      background-color: var(--fondo);
      color: var(--texto);
      font-size: 0.88rem;
      text-transform: uppercase;
    }

    .btn-cupon {
      background-color: var(--acento);
      color: white;
      border: none;
      padding: 0 14px;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
    }

    .desglose-totales {
      margin: 14px 0;
      padding: 12px;
      background-color: rgba(255, 255, 255, 0.03);
      border-radius: 10px;
      border: 1px solid var(--borde);
    }

    .fila-desglose {
      display: flex;
      justify-content: space-between;
      font-size: 0.88rem;
      color: var(--texto-secundario);
      margin-bottom: 6px;
    }

    .descuento-linea {
      color: #4ade80;
      font-weight: 600;
    }

    .fila-total {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 1.15rem;
      margin: 10px 0 0 0;
      padding-top: 10px;
      border-top: 1px solid var(--borde);
    }

    .fila-total strong {
      color: var(--whatsapp);
      font-size: 1.4rem;
    }

    .caja-pichincha {
      background-color: #0b132b;
      border: 2px solid var(--pichincha-amarillo);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 16px;
    }

    .pichincha-titulo {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }

    .icono-banco {
      font-size: 1.5rem;
    }

    .pichincha-titulo h4 {
      color: var(--pichincha-amarillo);
      font-size: 0.95rem;
    }

    .pichincha-titulo p {
      font-size: 0.78rem;
      color: var(--texto-secundario);
    }

    .datos-cuenta {
      background-color: rgba(255, 255, 255, 0.05);
      padding: 10px;
      border-radius: 8px;
      font-size: 0.85rem;
      margin-bottom: 12px;
    }

    .datos-cuenta p {
      margin-bottom: 5px;
    }

    .btn-copiar {
      background-color: var(--pichincha-amarillo);
      color: var(--pichincha-azul);
      border: none;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 0.72rem;
      font-weight: 700;
      cursor: pointer;
      margin-left: 6px;
    }

    .campo-comprobante label {
      display: block;
      font-size: 0.8rem;
      color: var(--texto-secundario);
      margin-bottom: 6px;
    }

    .fila-verificacion {
      display: flex;
      gap: 8px;
    }

    .fila-verificacion input {
      flex: 1;
      padding: 9px 10px;
      border-radius: 8px;
      border: 1px solid var(--borde);
      background-color: var(--fondo);
      color: var(--texto);
      font-size: 0.88rem;
    }

    .btn-verificar {
      background-color: var(--pichincha-amarillo);
      color: var(--pichincha-azul);
      border: none;
      padding: 0 12px;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }

    .estado-verificacion {
      font-size: 0.8rem;
      margin-top: 8px;
      padding: 8px 10px;
      border-radius: 6px;
      background-color: rgba(255, 255, 255, 0.06);
    }

    .estado-verificacion.exito {
      background-color: rgba(34, 197, 94, 0.15);
      color: #4ade80;
      border: 1px solid rgba(34, 197, 94, 0.4);
    }

    .estado-verificacion.error {
      background-color: rgba(239, 68, 68, 0.15);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.4);
    }

    .btn-whatsapp-pago {
      width: 100%;
      background-color: var(--whatsapp);
      color: white;
      border: none;
      padding: 13px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 0.96rem;
      cursor: pointer;
    }

    .footer {
      text-align: c
